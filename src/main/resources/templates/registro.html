<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Mock - Registro</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/style-registro.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-steam">
    <div class="container py-2">
        <a class="navbar-brand brand-logo" th:href="@{/home}">
            <img th:src="@{/images/logo.png}" alt="Steam Mock Logo" width="45" height="45" class="me-2 align-middle" style="filter: drop-shadow(0 0 5px rgba(102,192,244,0.3));">
            <div class="d-inline-block align-middle" style="line-height: 1;">
                <span class="steam-text">STEAM</span><span class="mock-text">MOCK</span>
            </div>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/catalogo}" class="btn btn-steam-blue btn-sm px-3">← Volver al catálogo</a>
        </div>
    </div>
</nav>
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card reg-card p-4" style="width:100%; max-width:520px;">
        <h4 class="form-label small-muted mb-1">Crear cuenta</h4>
        <div th:if="${registroError}" class="alert alert-danger" th:text="${registroError}"></div>
        <form th:action="@{/save}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label class="form-label small-muted mb-1">Usuario (email)</label>
                <input type="email"
                       th:field="*{username}"
                       class="form-control steam-input"
                       th:classappend="${#fields.hasErrors('username')} ? ' is-invalid' : ''"
                       placeholder="admin@test.com">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label small-muted mb-1">Contraseña</label>
                <input type="password"
                       th:field="*{password}"
                       class="form-control steam-input"
                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''"
                       placeholder="contraseña">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Registrarse</button>
            </div>
        </form>
        <p> </p>
        <div class="form-label small-muted mb-1">Ya tenés cuenta? <a th:href="@{/login}" class="btn btn-steam-green">Iniciar sesión</a></div>
    </div>
</div>
<div class="footer">Grupo 9 — Interfaz de ejemplo</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/loader.js}"></script>
</body>
</html>
