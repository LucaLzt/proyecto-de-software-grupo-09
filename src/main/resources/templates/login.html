<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steam Mock - Iniciar sesión</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-steam">
    <div class="container py-2">
        <a class="navbar-brand brand-logo" th:href="@{/home}">
            <img th:src="@{/images/logo.png}" alt="Steam Mock Logo" width="45" height="45" class="me-2 align-middle" style="filter: drop-shadow(0 0 5px rgba(102,192,244,0.3));">
            <div class="d-inline-block align-middle" style="line-height: 1;">
                <span class="steam-text">STEAM</span><span class="mock-text">MOCK</span>
            </div>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/catalogo}" class="btn btn-steam-blue btn-sm px-3">← Volver al catálogo</a>
        </div>
    </div>
</nav>
<div class="container d-flex justify-content-center align-items-center flex-grow-1" style="min-height:80vh;">
    <div class="card login-card p-5" style="width:100%; max-width:450px;">
        <div class="text-center mb-4">
            <img th:src="@{/images/logo.png}" alt="Logo Grupo 9" width="65" height="65" class="mb-3">
            <h3 class="mb-0 fw-bold">INICIAR SESIÓN</h3>
        </div>

        <div th:if="${error != null}" class="alert alert-danger small text-center" style="background-color: rgba(220, 53, 69, 0.1); border-color: #dc3545; color: #ff6b7a;">
            Usuario o contraseña inválidos.
        </div>
        <div th:if="${logout != null}" class="alert alert-success small text-center" style="background-color: rgba(25, 135, 84, 0.1); border-color: #198754; color: #75b022;">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/loginprocess}" method="post" class="mb-4">
            <div class="mb-3">
                <label for="username" class="form-label small-muted mb-1">Email</label>
                <input type="text" name="username" id="username" class="form-control steam-input">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label small-muted mb-1">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control steam-input">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label small-muted" for="remember">
                        Recordarme
                    </label>
                </div>
                <div><a href="#" class="small steam-link">¿Olvidaste tu contraseña?</a></div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-steam-blue">Iniciar sesión</button>
            </div>
        </form>

        <div class="text-center small-muted small pt-3" style="border-top: 1px solid rgba(255,255,255,0.05);">
            ¿Es tu primera vez en Steam Mock? <br>
            <a th:href="@{/registro}" class="steam-link fw-bold mt-1 d-inline-block">Crear una cuenta gratuita</a>
        </div>
    </div>
</div>
<div class="footer">Grupo 9 — Interfaz de ejemplo</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/loader.js}"></script>
</body>
</html>
