<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steam Mock - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <style>
        body {
            background: #0b2838;
            color: #fff;
        }

        .login-card {
            background: #0f2b38;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        a.steam-link {
            color: #66c0f4;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card login-card p-4 shadow" style="width:100%; max-width:420px;">
        <h3 class="mb-3">Iniciar sesión</h3>

        <div th:if="${error != null}" class="alert alert-danger small">Usuario o contraseña inválidos.</div>
        <div th:if="${logout != null}" class="alert alert-success small">Sesión cerrada correctamente.</div>

        <form th:action="@{/loginprocess}" method="post" class="mb-3">
            <div class="mb-2">
                <label for="username" class="form-label small">Usuario</label>
                <input type="text" name="username" id="username" class="form-control form-control-sm"
                       placeholder="usuario o email">
            </div>
            <div class="mb-2">
                <label for="password" class="form-label small">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control form-control-sm"
                       placeholder="contraseña">
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <input type="checkbox" id="remember" name="remember"> <label for="remember"
                                                                                 class="small">Recordarme</label>
                </div>
                <div><a href="#" class="small steam-link">¿Olvidaste tu contraseña?</a></div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            </div>
        </form>

        <div class="text-center small-muted small">¿No tenés cuenta? <a th:href="@{/registro}" class="steam-link">Registrate</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
