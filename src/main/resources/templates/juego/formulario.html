<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cargar Nuevo Juego</title>
    <!-- Un estilo rápido para que no se vea horrible -->
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .form-container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Agregar Juego a Steam</h2>

    <!-- th:action apunta al @PostMapping y th:object recibe el new Juego() del @GetMapping -->
    <form th:action="@{/juego/guardar}" th:object="${juego}" method="post">

        <div class="form-group">
            <label for="nameGame">Nombre del Juego:</label>
            <!-- th:field se asocia a "private String nameGame" -->
            <input type="text" id="nameGame" th:field="*{nameGame}" required />
        </div>

        <div class="form-group">
            <label for="description">Descripción:</label>
            <!-- th:field se asocia a "private String description" -->
            <textarea id="description" th:field="*{description}" rows="4" required></textarea>
        </div>

        <div class="form-group">
            <label for="price">Precio:</label>
            <!-- th:field se asocia a "private float price" -->
            <input type="number" step="0.01" id="price" th:field="*{price}" required />
        </div>

        <button type="submit">Guardar Juego</button>
    </form>
</div>

</body>
</html>
