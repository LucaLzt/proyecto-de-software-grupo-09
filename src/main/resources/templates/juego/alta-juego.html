<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Mock - Alta de juego</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --steam-bg: #0b2838;
            --steam-accent: #66c0f4;
            --card-bg: #0f2b38;
            --text-soft: #b8c7d1;
        }

        body {
            background: linear-gradient(180deg, var(--steam-bg) 0%, #071825 100%);
            color: white;
            min-height: 100vh;
        }

        .steam-link {
            color: var(--steam-accent);
            text-decoration: none;
        }

        .card-steam {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
            border-radius: 12px;
        }

        .navbar-steam {
            background: rgba(5, 20, 28, 0.92);
        }

        .brand-logo {
            color: var(--steam-accent) !important;
            font-weight: 700;
        }

        .form-label {
            color: var(--text-soft);
        }

        .form-control {
            background-color: #0b1f2a;
            border-color: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .form-control:focus {
            background-color: #0b1f2a;
            color: white;
            border-color: var(--steam-accent);
            box-shadow: 0 0 0 0.2rem rgba(102, 192, 244, 0.15);
        }

        .form-control::placeholder {
            color: #7f97a7;
        }

        .invalid-feedback {
            display: block;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-steam">
    <div class="container py-2">
        <a class="navbar-brand brand-logo" th:href="@{/home}">
            <img th:src="@{/images/logo.png}" alt="Steam Mock Logo" width="45" height="45" class="me-2 align-middle" style="filter: drop-shadow(0 0 5px rgba(102,192,244,0.3));">
            <div class="d-inline-block align-middle" style="line-height: 1;">
                <span class="steam-text">STEAM</span><span class="mock-text">MOCK</span>
            </div>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/home}" class="btn btn-steam-blue">Inicio</a>
            <a th:href="@{/catalogo}" class="btn btn-steam-blue">Catálogo</a>
            <a th:href="@{/logout}" class="btn btn-steam-green">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Alta de juego</h2>
            <p class="mb-0" style="color: var(--text-soft);">Completa todos los datos del juego para publicarlo en el catálogo.</p>
        </div>
        <a th:href="@{/catalogo}" class="btn btn-steam-blue">← Volver al catálogo</a>
    </div>

    <div class="card card-steam p-4">
        <form th:action="@{/juego/guardar}" th:object="${juego}" method="post" class="row g-3">
            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger col-12 mb-0">
                <div>Revisá los campos marcados antes de guardar.</div>
                <ul class="mb-0 mt-2" style="list-style: none; padding-left: 0;">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                       th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid' : ''"
                       placeholder="Counter-Strike 2">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="col-md-6">
                <label for="desarrollador" class="form-label">Desarrollador</label>
                <input type="text" id="desarrollador" th:field="*{desarrollador}" class="form-control"
                       th:classappend="${#fields.hasErrors('desarrollador')} ? ' is-invalid' : ''"
                       placeholder="Valve">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('desarrollador')}" th:errors="*{desarrollador}"></div>
            </div>

            <div class="col-md-4">
                <label for="precio" class="form-label">Precio</label>
                <!-- Usar input tipo texto con inputmode decimal para forzar punto como separador -->
                <input type="text" id="precio" inputmode="decimal" pattern="\d+(\.\d{1,2})?" th:field="*{precio}" class="form-control"
                       th:classappend="${#fields.hasErrors('precio')} ? ' is-invalid' : ''"
                       placeholder="0.00" title="Usá punto como separador decimal, p.ej. 19.99">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>

            <div class="col-md-4">
                <label for="genero" class="form-label">Género</label>
                <input type="text" id="genero" th:field="*{genero}" class="form-control"
                       th:classappend="${#fields.hasErrors('genero')} ? ' is-invalid' : ''"
                       placeholder="FPS, RPG, MOBA...">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></div>
            </div>

            <div class="col-md-4">
                <label for="imagen" class="form-label">Imagen principal</label>
                <input type="url" id="imagen" th:field="*{imagen}" class="form-control"
                       th:classappend="${#fields.hasErrors('imagen')} ? ' is-invalid' : ''"
                       placeholder="https://...">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></div>
            </div>

            <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="4" class="form-control"
                          th:classappend="${#fields.hasErrors('descripcion')} ? ' is-invalid' : ''"
                          placeholder="Descripción breve del juego"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
            </div>

            <div class="col-12">
                <label for="requisitosMinimos" class="form-label">Requisitos mínimos</label>
                <textarea id="requisitosMinimos" th:field="*{requisitosMinimos}" rows="3" class="form-control"
                          th:classappend="${#fields.hasErrors('requisitosMinimos')} ? ' is-invalid' : ''"
                          placeholder="OS: Windows 10, RAM: 8GB..."></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('requisitosMinimos')}" th:errors="*{requisitosMinimos}"></div>
            </div>

            <div class="col-12">
                <label for="requisitosRecomendados" class="form-label">Requisitos recomendados</label>
                <textarea id="requisitosRecomendados" th:field="*{requisitosRecomendados}" rows="3" class="form-control"
                          th:classappend="${#fields.hasErrors('requisitosRecomendados')} ? ' is-invalid' : ''"
                          placeholder="OS: Windows 11, RAM: 16GB..."></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('requisitosRecomendados')}" th:errors="*{requisitosRecomendados}"></div>
            </div>

            <div class="col-md-6">
                <label for="imagenExtra1" class="form-label">Imagen extra 1 <span style="color: var(--text-soft);">(opcional)</span></label>
                <input type="url" id="imagenExtra1" th:field="*{imagenExtra1}" class="form-control"
                       th:classappend="${#fields.hasErrors('imagenExtra1')} ? ' is-invalid' : ''"
                       placeholder="https://...">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('imagenExtra1')}" th:errors="*{imagenExtra1}"></div>
            </div>

            <div class="col-md-6">
                <label for="imagenExtra2" class="form-label">Imagen extra 2 <span style="color: var(--text-soft);">(opcional)</span></label>
                <input type="url" id="imagenExtra2" th:field="*{imagenExtra2}" class="form-control"
                       th:classappend="${#fields.hasErrors('imagenExtra2')} ? ' is-invalid' : ''"
                       placeholder="https://...">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('imagenExtra2')}" th:errors="*{imagenExtra2}"></div>
            </div>

            <div class="col-12 d-flex gap-2 justify-content-end mt-2">
                <a th:href="@{/catalogo}" class="btn btn-danger mt-2">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar juego</button>
            </div>
        </form>
    </div>
</div>
<div class="footer">Grupo 9 — Interfaz de ejemplo</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/loader.js}"></script>
</body>
</html>
