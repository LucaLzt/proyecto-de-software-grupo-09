<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${juego.nombre}">Detalle</title>
    <link rel="icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-steam">
    <div class="container">
        <a class="navbar-brand brand-logo" th:href="@{/home}">
            <img th:src="@{/images/logo.png}" alt="Steam Mock Logo" width="45" height="45" class="me-2 align-middle" style="filter: drop-shadow(0 0 5px rgba(102,192,244,0.3));">
            <div class="d-inline-block align-middle" style="line-height: 1;">
                <span class="steam-text">STEAM</span><span class="mock-text">MOCK</span>
            </div>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/catalogo}" class="btn btn-steam-blue btn-sm px-3">Catálogo</a>
            <a th:href="@{/carrito}" sec:authorize="isAuthenticated()" class="btn btn-steam-blue btn-sm px-3">Carrito</a>
            <a th:href="@{/login}" sec:authorize="isAnonymous()" class="btn btn-steam-green">Iniciar sesión</a>
            <a th:href="@{/logout}" sec:authorize="isAuthenticated()" class="btn btn-steam-green">Cerrar sesión</a>
        </div>
    </div>
</nav>

<main class="container mt-4">

    <div th:if="${mensaje}" class="alert alert-info alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Header del juego -->
    <div class="row mb-4">
        <div class="col-12">
            <h1 th:text="${juego.nombre}">Nombre</h1>
            <span class="badge-genero" th:text="${juego.genero}">Género</span>
            <span class="small-muted ms-3" th:text="${juego.desarrollador}">Desarrollador</span>
        </div>
    </div>

    <div class="row g-4">

        <!-- Imagen principal + extras -->
        <div class="col-md-8">
            <img th:src="${juego.imagen}" th:alt="${juego.nombre}"
                 class="w-100 rounded mb-3"
                 style="max-height:350px; object-fit:cover;"/>

            <!-- Imágenes extra -->
            <div class="row g-2" th:if="${juego.imagenExtra1 != null}">
                <div class="col-6">
                    <img th:src="${juego.imagenExtra1}" class="w-100 rounded"
                         style="height:140px; object-fit:cover;"/>
                </div>
                <div class="col-6" th:if="${juego.imagenExtra2 != null}">
                    <img th:src="${juego.imagenExtra2}" class="w-100 rounded"
                         style="height:140px; object-fit:cover;"/>
                </div>
            </div>

            <!-- Descripción -->
            <div class="card-dark p-3 mt-3">
                <h5>Descripción</h5>
                <p class="small-muted" th:text="${juego.descripcion}">Descripción</p>
            </div>
        </div>

        <!-- Panel lateral -->
        <div class="col-md-4">
            <div class="card-dark p-3 mb-3">
                <h4 th:text="${juego.precio == 0.0 ? 'Gratis' : '$' + juego.precio}"
                    style="color: #66c0f4;">Precio</h4>

                <div sec:authorize="isAuthenticated()">
                    <form th:action="@{/carrito/agregar/{juegoId}(juegoId=${juego.id})}" method="post">
                        <button type="submit" class="btn btn-success w-100 mt-2">Agregar al carrito</button>
                    </form>
                    <!-- If it is a favorite, show the remove button -->
                    <form th:if="${esFavorito}" th:action="@{/favoritos/eliminar/{juegoId}(juegoId=${juego.id})}" method="post">
                        <button type="submit" class="btn btn-outline-light w-100 mt-2">Quitar de favoritos</button>
                    </form>
                    <!-- If it is NOT a favorite, show the add button -->
                    <form th:unless="${esFavorito}" th:action="@{/favoritos/agregar/{juegoId}(juegoId=${juego.id})}" method="post">
                        <button type="submit" class="btn btn-danger w-100 mt-2">Agregar a favoritos</button>
                    </form>
                </div>
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-success w-100 mt-2">Agregar al carrito</a>
                    <a th:href="@{/login}" class="btn btn-danger w-100 mt-2">Agregar a favoritos</a>
                </div>
            </div>

            <div class="card-dark p-3">
                <p class="mb-1"><span class="small-muted">Género:</span>
                    <span th:text="${juego.genero}"></span></p>
                <p class="mb-1"><span class="small-muted">Desarrollador:</span>
                    <span th:text="${juego.desarrollador}"></span></p>
            </div>
        </div>
    </div>

    <!-- Requisitos del sistema -->
    <div class="row mt-4 mb-5">
        <div class="col-12">
            <div class="card-dark p-3">
                <h5>Requisitos del sistema</h5>
                <div class="row">
                    <div class="col-md-6">
                        <div class="req-box">
                            <h6 style="color: var(--steam-accent)">Mínimos</h6>
                            <p class="small-muted mb-0"
                               th:text="${juego.requisitosMinimos != null ?
                               juego.requisitosMinimos : 'No especificados'}"></p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="req-box">
                            <h6 style="color: var(--steam-accent)">Recomendados</h6>
                            <p class="small-muted mb-0"
                               th:text="${juego.requisitosRecomendados != null ?
                               juego.requisitosRecomendados : 'No especificados'}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">Grupo 9 — Interfaz de ejemplo</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/loader.js}"></script>
</body>
</html>
