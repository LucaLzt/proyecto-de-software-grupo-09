<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Mock - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <style>
        :root {
            --steam-bg: #0b2838;
            --steam-accent: #66c0f4;
            --card-bg: #122f3d;
            --muted: #94a3b8;
        }

        body {
            background: linear-gradient(180deg, var(--steam-bg) 0%, #071825 100%);
            color: white;
            min-height: 100vh;
        }

        .navbar-steam {
            background: rgba(5, 20, 28, 0.9);
        }

        .brand-logo {
            font-weight: 700;
            color: var(--steam-accent);
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: white;
        }

        .footer {
            margin-top: 40px;
            padding: 20px 0;
            text-align: center;
            color: var(--muted);
        }

        .small-muted {
            color: var(--muted);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-steam">
    <div class="container">
        <a class="navbar-brand brand-logo" href="/home">Steam Mock</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link text-white" href="/home">Store</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Library</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Community</a></li>
            </ul>

           <form class="d-flex me-3" role="search" th:action="@{/home}" method="get">
    <input class="form-control form-control-sm" type="search" name="busqueda"
           th:value="${busqueda}" placeholder="Buscar juegos..." aria-label="Search">
    <button class="btn btn-sm btn-outline-light ms-2" type="submit">Buscar</button>
</form>

            <div class="d-flex">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" id="userMenu" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Cuenta
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                        <li><a class="dropdown-item" href="#">Perfil</a></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Hero -->
<main class="container mt-4">
    <div class="row">
        <div class="col-12 mb-4">
            <div class="p-4 rounded game-card">
                <h1>Bienvenido a Steam Mock</h1>
                <p class="small-muted">Explorá ofertas, tu biblioteca y la comunidad. Esto es una interfaz simple
                    inspirada en Steam.</p>
            </div>
        </div>
    </div>

    <!-- Sample grid of games -->
    <!-- Sample grid of games -->
<div class="row g-3">
    <div class="col-6 col-md-3" th:each="juego : ${juegos}">
        <div class="card game-card p-2">
            <img th:src="${juego.imagen}" th:alt="${juego.nombre}"
                 style="height:120px; object-fit:cover; border-radius:4px;"
                 onerror="this.style.background='#0f3a4a'; this.src=''"/>
            <div class="card-body p-2">
                <h6 class="card-title" th:text="${juego.nombre}">Nombre</h6>
                <p class="small-muted mb-1"
                   th:text="${juego.precio == 0.0 ? 'Gratis' : '$' + juego.precio}">Precio</p>
                <a th:href="@{/catalogo/{id}(id=${juego.id})}"
                   class="btn btn-sm btn-outline-light">Ver</a>
            </div>
        </div>
    </div>

    <div class="col-12" th:if="${#lists.isEmpty(juegos)}">
        <p class="text-center small-muted">No se encontraron juegos.</p>
    </div>
</div>
      
    <div class="footer">Grupo 9 — Interfaz de ejemplo</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
